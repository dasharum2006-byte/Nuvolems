     <main class="main-content">
        <div class="content-left">

                </div>
                <div class="card-look">
                    <div class="card-item">

                </div> 
            </div>
        </section>


        <section class="section-moods">
        <h3 class="section-title">Moods</h3>
            <div class="cards-grid">
                <div class="card-look">
                    <div class="card-item">

                    </div>
                    <h4>Chill</h4>
                </div>
                <div class="card-look">
                    <div class="card-item">

                    </div>
                    <h4>Energy</h4>
                </div>
                <div class="card-look">
                    <div class="card-item">

                    </div>
                    <h4>Focus</h4>
                </div>
                <div class="card-look">

                    </div>

                </div>
                <div class="card-look">

                </div>
                <div class="card-look">

                    </div>
                    <h4>Sad</h4>
                </div>
                <div class="card-look">

        </section>
        </div>
        <!-- player vinil-->
         <div class="player-right"> 
            <!-- <div class="vinil-right"> --> -->
            <!-- главный корпус проигрывателя - родитель -->
             <!-- <div class="vinil-player-body"> -->
                <!-- типо коробка для обложки музыкальной и самой пластины -->
                <!-- <img class="vinil-disk-treck" src="assets/sabrina1.jpeg" alt="Обложка">
                виниловая пластинка -->
                 <!-- <img class="vinil-disk-plast" src="assets/vinil-plastinka1.png" alt="Виниловая Пластина">
             </div>  -->
             <!--  игла которая будет сверху -->
               <!-- <img class="player-i" src="" alt="Игла"> -->

             <div class="player-container">
                <img src="assets/sabrina1.jpeg" class="coverforplayer" alt="ОбложкаДляПлеера">
                <button class="songplayer">Song</button>
                <button class="artistplayer">Artist</button>
                <!-- time -->
                 <div class="song-slider">
                    <span class="current-time">00:00</span>
                    <input type="range" value="0" class="seek-bar">
                    <span class="song-duration">00:00</span>
                 </div>

                <div class="control-btn">
                    <div class="sound-container">
                    <button class="sound">
                        <img id="sound-img" src="assets/znachki/volumeup.svg" alt="Звук">
                        </button>
                        <div class="soundplayer-nosound" id="playersound-nosound">
                            <!-- ползунок чтобы им можно пользоваться -->
                             <input type="range" min="0" max="100" value="70" class="volume-slider">
                        </div>
                    </div>
                    <button class="dislike">
                        <img src="assets/znachki/heartminus.svg">
                    </button>
                    <div class="control-btn">
                    <button class="skipprevious">
                        <img src="assets/znachki/skipprevious.svg">
                    </button>
                    <!-- чтобы потом с менять play - pause -->
                    <button id="btn-play-pause" class="btn-play-pause">
                        <img id="play-img" src="assets/znachki/playarrow.svg">
                    </button>

                    <div class="control-btn">
                    <button class="skipnext">
                        <img src="assets/znachki/skipnext.svg">
                    </button>

                    <div class="control-btn">
                    <button class="like">
                        <img src="assets/znachki/heartplus.svg">
                    </button>

                    <div class="control-btn">
                    <button class="morevert">
                        <img src="assets/znachki/morevert.svg" alt="МенюДляПлеера">
                        <div class="player-settings" id="settings-player">
                            <div class="settings-player-item">
                                <img src="assets/znachki/shuffle.svg" alt="Shuffle" class="setting-player-icon">
                                <span class="settings-player-span">Shuffle</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/repeat.svg" alt="Repeat" class="setting-player-icon">
                                <span class="settings-player-span">Repeat</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/queue.svg" alt="OpenQueue" class="setting-player-icon">
                                <span class="settings-player-span">Open queue</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/textadd.svg" alt="ShowLyrics" class="setting-player-icon">
                                <span class="settings-player-span">Show lyrics</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/discovertune.svg" alt="SoundSettings" class="setting-player-icon">
                                <span class="settings-player-span">Sound settings</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/add.svg" alt="AddToPlaylist" class="setting-player-icon">
                                <span class="settings-player-span">Add to playlist</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/artist.svg" alt="GoToArtist" class="setting-player-icon">
                                <span class="settings-player-span">Go to artist</span>
                            </div>
                            <div class="settings-player-item">
                                <img src="assets/znachki/album.svg" alt="GoToAlbum" class="setting-player-icon">
                                <span class="settings-player-span">Go to album</span>
                            </div>
                        </div>
                    </button>
                    
                    </div>
                </div>
            </div>
         </div>
    </div>
</div>
